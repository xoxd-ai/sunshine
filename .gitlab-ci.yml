# Tinyland Sunshine - GitLab CI/CD Pipeline
# Darwin PKG and Rocky Linux RPM builds with code signing
#
# Based on upstream: https://github.com/LizardByte/Sunshine
# Tinyland modifications: Darwin PKG (notarized), Rocky 10 RPM, REST API enhancements

# Pipeline auto-cancellation: Only cancel sibling pipelines if a job fails
# Changed from on_new_commit:interruptible to prevent long-running Darwin builds
# from being canceled when new commits are pushed while queued (4+ hours)
workflow:
  auto_cancel:
    on_job_failure: all

stages:
  - build
  - test
  - package
  - sign
  - deploy

variables:
  # Build configuration
  CMAKE_BUILD_TYPE: Release
  # Sunshine version (from CMakeLists.txt or CI_COMMIT_TAG)
  SUNSHINE_VERSION: "0.24.0"
  # Git configuration - disable auto submodules, handle manually with shallow clones
  # The build-deps submodule is 1.4GB which takes too long for GitLab's submodule handling
  GIT_DEPTH: 20
  GIT_SUBMODULE_STRATEGY: none
  # Use git clone instead of git init + git fetch (fixes macOS fetch hangs)
  GIT_STRATEGY: clone
  # Disable git bundleURI feature - causes hangs on large repos
  # See: https://gitlab.com/gitlab-org/gitlab-runner/-/issues/30299
  # CRITICAL: Flag name is FF_USE_GIT_BUNDLE_URIS (with 'S') not FF_USE_GIT_BUNDLE_URI
  FF_USE_GIT_BUNDLE_URIS: "false"

# =============================================================================
# Templates
# =============================================================================

# Tinyland Darwin native runner template (petting-zoo-mini M1)
# IMPORTANT: Reset git variables to defaults - global FF_USE_GIT_BUNDLE_URIS:false causes
# git hang on macOS shell executor. Moonlight uses defaults and works fine.
.darwin_native:
  tags:
    - tinyland
    - darwin
    - native
  variables:
    # Reset to defaults for Darwin - global settings cause git hang on macOS shell executor
    # Moonlight CI uses all defaults and git completes in ~1 second
    GIT_STRATEGY: fetch
    FF_USE_GIT_BUNDLE_URIS: "true"  # Re-enable bundle URIs for Darwin
  before_script:
    - echo "Running on macOS $(sw_vers -productVersion)"
    - echo "Xcode $(xcodebuild -version | head -1)"
    - echo "Architecture $(uname -m)"

# Tinyland Darwin Docker runner template (petting-zoo-mini M1 with Colima)
# Use this for jobs that need Docker on macOS
.darwin_docker:
  tags:
    - tinyland
    - darwin
    - docker
  before_script:
    - echo "Running on macOS $(sw_vers -productVersion)"
    - echo "Architecture $(uname -m)"
    # Resolve Colima/Podman Docker socket conflicts
    # Ensures /var/run/docker.sock points to Colima (not Podman)
    - |
      if [[ -S "$HOME/.colima/default/docker.sock" ]]; then
        COLIMA_SOCK="$HOME/.colima/default/docker.sock"
        if [[ ! -S /var/run/docker.sock ]] || [[ "$(readlink /var/run/docker.sock 2>/dev/null)" != "$COLIMA_SOCK" ]]; then
          echo "Fixing Docker socket to point to Colima..."
          sudo ln -sf "$COLIMA_SOCK" /var/run/docker.sock 2>/dev/null || export DOCKER_HOST="unix://$COLIMA_SOCK"
        fi
      fi
    - 'docker info --format "Docker: {{.Name}} {{.ServerVersion}}"'

# Rocky Linux template - use Tinyland honey runner (Rocky 10 with Docker)
.rocky_linux:
  tags:
    - tinyland
    - linux
    - docker
  image: rockylinux/rockylinux:10
  before_script:
    - dnf install -y epel-release
    - dnf makecache
    - dnf update -y

# =============================================================================
# Build Stage
# =============================================================================

# macOS build using Homebrew dependencies
build-darwin:
  extends: .darwin_native
  stage: build
  timeout: 6h  # Darwin builds take 3-4h, need 6h safety margin (verified from runner logs)
  resource_group: darwin-build  # Only one Darwin build at a time (single M1 runner)
  variables:
    # Use fetch strategy for Darwin - clone strategy hangs on macOS shell executor
    # See: https://gitlab.com/gitlab-org/gitlab-runner/-/issues/30299
    # Moonlight uses defaults (fetch) and works; Sunshine's clone strategy hangs
    GIT_STRATEGY: fetch
  script:
    # Install dependencies via Homebrew (libva is Linux-only, skip on macOS)
    # Use boost@1.85 to avoid Boost.Process v1/v2 API breaking changes in 1.87+
    # Retry brew install in case of network issues (curl partial file errors)
    - for i in 1 2 3; do brew install cmake ninja boost@1.85 curl miniupnpc node openssl opus pkg-config && break || sleep 10; done
    - for i in 1 2 3; do brew install ffmpeg doxygen graphviz && break || sleep 10; done
    # Export paths (include boost@1.85 keg-only paths)
    - export PATH="/opt/homebrew/opt/boost@1.85/bin:/opt/homebrew/bin:$PATH"
    - export PKG_CONFIG_PATH="/opt/homebrew/opt/boost@1.85/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/openssl/lib/pkgconfig"
    - export LDFLAGS="-L/opt/homebrew/opt/boost@1.85/lib"
    - export CPPFLAGS="-I/opt/homebrew/opt/boost@1.85/include"
    # Initialize submodules with shallow clones (build-deps is 1.4GB)
    - git submodule update --init --recursive --depth 1 --jobs 4
    # Install npm dependencies and build web UI before cmake
    # This avoids NODE_PATH issues when cmake's ninja subprocess spawns npm
    # Use --include=dev to ensure devDependencies (vite, etc) are installed even if NODE_ENV=production
    - npm install --include=dev
    # CRITICAL: Prepend local node_modules/.bin to PATH so we use local vite, not global brew vite
    # The global vite can't find local node_modules when loading vite.config.cjs
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - export NODE_PATH="$PWD/node_modules:$NODE_PATH"
    # Verify we're using local vite
    - which vite && vite --version
    # Pre-build web UI with correct paths (cmake will skip this if already built)
    - mkdir -p build/assets/web
    - |
      SUNSHINE_SOURCE_ASSETS_DIR="$PWD/src_assets" \
      SUNSHINE_ASSETS_DIR="$PWD/build" \
      ./node_modules/.bin/vite build
    # Get version from CMakeLists.txt
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    - echo "Building Sunshine version $SUNSHINE_VERSION"
    # Configure (arm64 only for M1 runner)
    # Add OpenSSL and opus to include path (CPATH for system-wide include, LIBRARY_PATH for linking)
    - export CPATH="/opt/homebrew/opt/openssl/include:/opt/homebrew/opt/opus/include:$CPATH"
    - export LIBRARY_PATH="/opt/homebrew/opt/openssl/lib:/opt/homebrew/opt/opus/lib:$LIBRARY_PATH"
    - export CXXFLAGS="-I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/opus/include $CXXFLAGS"
    # NPM_OFFLINE=ON tells cmake to skip npm install (we already did it above)
    # This avoids NODE_PATH issues where cmake's npm install can't find vite
    - |
      cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
        -DCMAKE_OSX_ARCHITECTURES="arm64" \
        -DCMAKE_INCLUDE_PATH="/opt/homebrew/opt/openssl/include;/opt/homebrew/opt/opus/include" \
        -DCMAKE_LIBRARY_PATH="/opt/homebrew/opt/openssl/lib;/opt/homebrew/opt/opus/lib" \
        -DBoost_ROOT=/opt/homebrew/opt/boost@1.85 \
        -DBOOST_INCLUDEDIR=/opt/homebrew/opt/boost@1.85/include \
        -DBOOST_LIBRARYDIR=/opt/homebrew/opt/boost@1.85/lib \
        -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl \
        -DOPENSSL_INCLUDE_DIR=/opt/homebrew/opt/openssl/include \
        -DOPENSSL_CRYPTO_LIBRARY=/opt/homebrew/opt/openssl/lib/libcrypto.dylib \
        -DOPENSSL_SSL_LIBRARY=/opt/homebrew/opt/openssl/lib/libssl.dylib \
        -DCMAKE_CXX_FLAGS="-I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/opus/include" \
        -DSUNSHINE_ENABLE_WAYLAND=OFF \
        -DSUNSHINE_ENABLE_X11=OFF \
        -DSUNSHINE_ENABLE_DRM=OFF \
        -DSUNSHINE_ENABLE_CUDA=OFF \
        -DCUDA_FAIL_ON_MISSING=OFF \
        -DNPM_OFFLINE=ON
    # Build
    - cmake --build build --parallel
    # Create app bundle structure
    - mkdir -p build/Sunshine.app/Contents/MacOS
    - mkdir -p build/Sunshine.app/Contents/Resources
    - cp build/sunshine build/Sunshine.app/Contents/MacOS/ || cp build/src/sunshine build/Sunshine.app/Contents/MacOS/sunshine
    # Bundle Homebrew dependencies into app to avoid Gatekeeper issues with ad-hoc signed dylibs
    - mkdir -p build/Sunshine.app/Contents/Frameworks
    - |
      echo "=== Bundling Homebrew dependencies into Frameworks ==="
      # Copy and relink miniupnpc
      if [ -f /opt/homebrew/opt/miniupnpc/lib/libminiupnpc.21.dylib ]; then
        cp /opt/homebrew/opt/miniupnpc/lib/libminiupnpc.21.dylib build/Sunshine.app/Contents/Frameworks/
        install_name_tool -change /opt/homebrew/opt/miniupnpc/lib/libminiupnpc.21.dylib \
          @executable_path/../Frameworks/libminiupnpc.21.dylib \
          build/Sunshine.app/Contents/MacOS/sunshine
        echo "Bundled libminiupnpc.21.dylib"
      fi
      # Copy and relink opus
      if [ -f /opt/homebrew/opt/opus/lib/libopus.0.dylib ]; then
        cp /opt/homebrew/opt/opus/lib/libopus.0.dylib build/Sunshine.app/Contents/Frameworks/
        install_name_tool -change /opt/homebrew/opt/opus/lib/libopus.0.dylib \
          @executable_path/../Frameworks/libopus.0.dylib \
          build/Sunshine.app/Contents/MacOS/sunshine
        echo "Bundled libopus.0.dylib"
      fi
      # Copy and relink openssl
      if [ -f /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib ]; then
        cp /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib build/Sunshine.app/Contents/Frameworks/
        cp /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib build/Sunshine.app/Contents/Frameworks/
        install_name_tool -change /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib \
          @executable_path/../Frameworks/libssl.3.dylib \
          build/Sunshine.app/Contents/MacOS/sunshine
        install_name_tool -change /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib \
          @executable_path/../Frameworks/libcrypto.3.dylib \
          build/Sunshine.app/Contents/MacOS/sunshine
        # Fix inter-library dependencies (libssl depends on libcrypto)
        install_name_tool -change /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib \
          @executable_path/../Frameworks/libcrypto.3.dylib \
          build/Sunshine.app/Contents/Frameworks/libssl.3.dylib
        echo "Bundled openssl libraries"
      fi
      # Verify bundled dylibs
      echo "=== Bundled frameworks: ==="
      ls -la build/Sunshine.app/Contents/Frameworks/
      echo "=== Updated library references: ==="
      otool -L build/Sunshine.app/Contents/MacOS/sunshine | head -20
    - |
      cat > build/Sunshine.app/Contents/Info.plist << 'PLIST_EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>CFBundleExecutable</key>
        <string>sunshine</string>
        <key>CFBundleIdentifier</key>
        <string>dev.tinyland.sunshine</string>
        <key>CFBundleName</key>
        <string>Sunshine</string>
        <key>CFBundleVersion</key>
        <string>VERSION_PLACEHOLDER</string>
        <key>CFBundleShortVersionString</key>
        <string>VERSION_PLACEHOLDER</string>
        <key>LSMinimumSystemVersion</key>
        <string>12.0</string>
        <key>NSHighResolutionCapable</key>
        <true/>
      </dict>
      </plist>
      PLIST_EOF
    - sed -i '' "s/VERSION_PLACEHOLDER/$SUNSHINE_VERSION/g" build/Sunshine.app/Contents/Info.plist
  artifacts:
    paths:
      - build/Sunshine.app
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true  # Build may fail on initial setup

# Rocky Linux 10 build
build-rocky:
  extends: .rocky_linux
  stage: build
  resource_group: rocky-build  # Limit concurrent Rocky builds to prevent OOM
  script:
    # Install EPEL and PowerTools/CRB
    - dnf config-manager --set-enabled crb || true
    # Install build dependencies
    - dnf groupinstall -y "Development Tools"
    # Rocky 10 comes with GCC 14+ by default (supports C++23)
    # Rocky 9 needs gcc-toolset-13 for C++23 <format> support
    - |
      if dnf list gcc-toolset-13-gcc 2>/dev/null | grep -q gcc-toolset-13; then
        echo "Installing GCC toolset 13 for Rocky 9..."
        dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++
        source /opt/rh/gcc-toolset-13/enable
      else
        echo "Using default GCC for Rocky 10..."
        dnf install -y gcc gcc-c++ libstdc++-static
      fi
    - echo "Using GCC $(gcc --version | head -1)"
    - dnf install -y cmake ninja-build git doxygen graphviz
    # Install Node.js 20 from NodeSource (Vite requires Node 18+)
    - dnf module reset nodejs -y || true
    - dnf module enable nodejs:20 -y || true
    - dnf install -y nodejs || (curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - && dnf install -y nodejs)
    - echo "Using Node.js $(node --version)"
    - dnf install -y boost-devel curl-devel miniupnpc-devel openssl-devel opus-devel
    - dnf install -y libva-devel libvdpau-devel libdrm-devel
    - dnf install -y libX11-devel libXtst-devel libXrandr-devel libXfixes-devel
    - dnf install -y pulseaudio-libs-devel wayland-devel libcap-devel libevdev-devel mesa-libgbm-devel numactl-devel
    # Install tray/notification dependencies (appindicator or libnotify)
    - dnf install -y libnotify-devel libappindicator-gtk3-devel || dnf install -y libnotify-devel || true
    - dnf install -y ffmpeg-free-devel || dnf install -y ffmpeg-devel || true
    # Verify dynamic libmvec is available (required by pre-built x265 SIMD vectorization)
    - 'ls -la /usr/lib64/libmvec.so* || echo "WARNING: libmvec.so not found"'
    # Initialize submodules with shallow clones (build-deps is 1.4GB)
    - git submodule update --init --recursive --depth 1 --jobs 4
    # Get version
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    - echo "Building Sunshine version $SUNSHINE_VERSION"
    # Configure - Note: Rocky 9 doxygen is too old (1.8), disable docs (requires 1.10+)
    # The pre-built x265 uses vectorized math (_ZGVbN2v_log2) from glibc's libmvec.
    # CMake may add --as-needed flags that drop libmvec before static libraries are processed.
    # Use --no-as-needed to force libmvec to be retained, then absolute path to bypass search issues.
    # Use --push-state/--pop-state to scope the --no-as-needed flag to just libmvec.
    - |
      cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
        -DCMAKE_EXE_LINKER_FLAGS="-Wl,--no-as-needed -Wl,--start-group" \
        -DCMAKE_CXX_STANDARD_LIBRARIES="/usr/lib64/libmvec.so.1 -lm -Wl,--end-group" \
        -DBUILD_DOCS=OFF \
        -DSUNSHINE_ENABLE_WAYLAND=ON \
        -DSUNSHINE_ENABLE_X11=ON \
        -DSUNSHINE_ENABLE_DRM=ON \
        -DSUNSHINE_ENABLE_CUDA=OFF \
        -DCUDA_FAIL_ON_MISSING=OFF
    # Build with limited parallelism to avoid OOM (Boost headers are memory-intensive)
    # 4 parallel jobs × 4-6GB per compilation = 16-24GB, exceeds container 16GB limit
    # Use -j2 to stay within memory budget
    - cmake --build build --parallel 2
    # Copy binary and assets for packaging
    - mkdir -p build/dist
    - cp build/sunshine build/dist/ || cp build/src/sunshine build/dist/sunshine
    # Copy assets directory for RPM packaging (includes apps.json)
    - mkdir -p build/dist/assets
    - cp -r src_assets/linux/assets/* build/dist/assets/ 2>/dev/null || echo "No Linux assets found (OK for Darwin-only builds)"
  artifacts:
    paths:
      - build/dist/sunshine
      - build/dist/assets/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true  # Build may fail on initial setup

# =============================================================================
# Package Stage
# =============================================================================

# macOS PKG creation
package-darwin:
  extends: .darwin_native
  stage: package
  resource_group: darwin-build  # Share resource group with build-darwin
  needs:
    - job: build-darwin
      artifacts: true
  variables:
    # Use fetch strategy for Darwin - clone strategy hangs on macOS shell executor
    GIT_STRATEGY: fetch
  script:
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    - mkdir -p build/installer
    # Create PKG installer
    - mkdir -p pkg-root/Applications
    - cp -R build/Sunshine.app pkg-root/Applications/
    # Also install binary to /usr/local/bin (extract from app bundle)
    - mkdir -p pkg-root/usr/local/bin
    - cp build/Sunshine.app/Contents/MacOS/sunshine pkg-root/usr/local/bin/sunshine
    # Build PKG (single line to avoid shell escaping issues)
    - pkgbuild --root pkg-root --identifier "dev.tinyland.sunshine" --version "$SUNSHINE_VERSION" --install-location "/" build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg
  artifacts:
    paths:
      - build/installer/Sunshine-*.pkg
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

# Rocky Linux RPM package
package-rocky:
  extends: .rocky_linux
  stage: package
  resource_group: rocky-build  # Share resource group with build-rocky
  needs:
    - job: build-rocky
      artifacts: true
  script:
    - dnf install -y rpm-build rpmdevtools
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    - rpmdev-setuptree
    # Create spec file
    - |
      cat > ~/rpmbuild/SPECS/sunshine.spec << 'SPEC_EOF'
      Name:           sunshine
      Version:        %{version}
      Release:        1.tinyland%{?dist}
      Summary:        Self-hosted game streaming server
      License:        GPL-3.0
      URL:            https://gitlab.com/tinyland/tinyland-sunshine
      Source0:        sunshine

      Requires:       libva
      Requires:       libdrm
      Requires:       opus

      %description
      Sunshine is a self-hosted game streaming server implementing the
      Moonlight protocol. This is the Tinyland fork with REST API enhancements.

      %install
      mkdir -p %{buildroot}%{_bindir}
      install -m 755 %{SOURCE0} %{buildroot}%{_bindir}/sunshine

      %files
      %{_bindir}/sunshine
      SPEC_EOF
    # Build RPM
    - cp build/dist/sunshine ~/rpmbuild/SOURCES/
    - rpmbuild -bb ~/rpmbuild/SPECS/sunshine.spec --define "version $SUNSHINE_VERSION"
    - mkdir -p build/rpm
    - cp ~/rpmbuild/RPMS/*/*.rpm build/rpm/
  artifacts:
    paths:
      - build/rpm/*.rpm
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

# =============================================================================
# Sign Stage (Darwin)
# =============================================================================

sign-darwin:
  extends: .darwin_native
  stage: sign
  resource_group: darwin-build  # Share resource group with Darwin jobs
  needs:
    - job: build-darwin
      artifacts: true
    - job: package-darwin
      artifacts: true
  variables:
    # Use fetch strategy for Darwin - clone strategy hangs on macOS shell executor
    GIT_STRATEGY: fetch
  script:
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    - |
      if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
        echo "=== Setting up code signing with CI best practices ==="
        # Decode certificates
        echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > certificate.p12

        # ========================================================================
        # TEMPORARY KEYCHAIN WITH CI BEST PRACTICES
        # ========================================================================
        # Research-based approach from crush CI configuration:
        # 1. Create temporary keychain with password (required for partition list)
        # 2. Configure for CI: no timeout, no auto-lock
        # 3. Set partition list with -s flag and "apple:" for headless access
        # 4. Import only correct intermediates (Developer ID G2, NOT WWDR G2)
        # 5. Include login keychain for intermediate cert trust validation
        # References:
        # - https://byteable.medium.com/creating-a-temporary-keychain-for-your-build-system-e598628c65fd
        # - https://developer.apple.com/forums/thread/666107
        # - https://discuss.circleci.com/t/cssmerr-tp-not-trusted-for-developer-id-certificate/49911
        # ========================================================================

        echo "=== Creating temporary keychain ==="
        KEYCHAIN_NAME="signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

        # Delete any existing keychain from previous runs
        security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true

        # Create keychain with password
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

        # Configure for CI: no timeout, no auto-lock
        security set-keychain-settings "$KEYCHAIN_NAME"

        # Unlock keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

        # Set as default
        security default-keychain -s "$KEYCHAIN_NAME"

        # Add to search list with login and SystemRootCertificates
        LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
        echo "=== Setting keychain search list ==="
        security list-keychains -d user -s "$KEYCHAIN_NAME" "$LOGIN_KEYCHAIN" /System/Library/Keychains/SystemRootCertificates.keychain

        echo "=== Current keychain search list ==="
        security list-keychains -d user

        # Import Developer ID G2 intermediate (NOT WWDR G2 - it chains to wrong root)
        if [ -n "$APPLE_DEVELOPER_ID_CA_G2" ]; then
          echo "=== Importing Developer ID Certification Authority G2 ==="
          echo "$APPLE_DEVELOPER_ID_CA_G2" | base64 -d > DeveloperIDG2CA.cer

          # Import to signing keychain
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_NAME" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -A 2>&1 || true

          # Also import to login keychain for trust validation
          echo "=== Importing G2 intermediate to login keychain ==="
          security import DeveloperIDG2CA.cer -k "$LOGIN_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -A 2>&1 || true
        fi

        # Import Application certificate
        echo "=== Importing Developer ID Application certificate ==="
        security import certificate.p12 -k "$KEYCHAIN_NAME" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A

        # Import Installer certificate
        if [ -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" ]; then
          echo "=== Importing Developer ID Installer certificate ==="
          echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 -d > installer_certificate.p12
          security import installer_certificate.p12 -k "$KEYCHAIN_NAME" -P "${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/productsign -T /usr/bin/pkgbuild -A

          # Remove WWDR CA - G2 if present (wrong root chain)
          echo "=== Removing Apple WWDR CA - G2 if present ==="
          security delete-certificate -c "Apple Worldwide Developer Relations CA - G2" "$KEYCHAIN_NAME" 2>&1 || echo "WWDR CA - G2 not found (OK)"
        fi

        # Set partition list for headless CI access
        echo "=== Setting partition list for headless access ==="
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

        # Sign the app bundle if it exists
        if [ -d "build/Sunshine.app" ]; then
          echo "=== Signing bundled frameworks first (dependencies before app) ==="
          if [ -d "build/Sunshine.app/Contents/Frameworks" ]; then
            for dylib in build/Sunshine.app/Contents/Frameworks/*.dylib; do
              if [ -f "$dylib" ]; then
                echo "Signing framework: $dylib"
                codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$dylib"
                codesign --verify --verbose "$dylib"
              fi
            done
          fi
          echo "=== Signing Sunshine.app bundle ==="
          codesign --force --options runtime --timestamp --deep --sign "$APPLE_DEVELOPER_ID_APPLICATION" build/Sunshine.app
          codesign --verify --verbose=4 build/Sunshine.app
        fi

        # Sign the standalone binary (needs timestamp for notarization)
        if [ -f "build/sunshine" ]; then
          echo "=== Signing sunshine binary ==="
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" build/sunshine
          codesign --verify --verbose build/sunshine
        fi

        # Rebuild PKG with signed binaries (the package-darwin PKG has unsigned copies)
        # This ensures both /Applications/Sunshine.app and /usr/local/bin/sunshine are signed
        echo "=== Rebuilding PKG with signed binaries ==="
        rm -rf pkg-root
        mkdir -p pkg-root/Applications
        cp -R build/Sunshine.app pkg-root/Applications/
        mkdir -p pkg-root/usr/local/bin
        # Copy binary and re-sign it (copying can invalidate signatures)
        cp build/Sunshine.app/Contents/MacOS/sunshine pkg-root/usr/local/bin/sunshine
        echo "=== Signing standalone /usr/local/bin/sunshine binary ==="
        codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" pkg-root/usr/local/bin/sunshine
        codesign --verify --verbose pkg-root/usr/local/bin/sunshine
        # Build new unsigned PKG with signed contents
        pkgbuild --root pkg-root --identifier "dev.tinyland.sunshine" --version "$SUNSHINE_VERSION" --install-location "/" build/installer/Sunshine-$SUNSHINE_VERSION-unsigned-new.pkg
        # Remove old unsigned PKG
        rm -f build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg
        mv build/installer/Sunshine-$SUNSHINE_VERSION-unsigned-new.pkg build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg

        # Sign and notarize PKG
        if [ -n "$APPLE_DEVELOPER_ID_INSTALLER" ]; then
          echo "=== Diagnostics before PKG signing ==="
          echo "Certificates in signing keychain:"
          security find-certificate -a "$KEYCHAIN_NAME" | grep "alis" || echo "No certificates found"

          echo "Signing identities:"
          security find-identity -v "$KEYCHAIN_NAME"

          echo "=== Signing PKG with Developer ID Installer ==="
          productsign --sign "$APPLE_DEVELOPER_ID_INSTALLER" \
            --keychain "$KEYCHAIN_NAME" \
            build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg \
            build/installer/Sunshine-$SUNSHINE_VERSION.pkg

          rm build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg
          echo "=== PKG signed successfully ==="
          pkgutil --check-signature build/installer/Sunshine-$SUNSHINE_VERSION.pkg

          # Notarize if credentials available
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_NOTARIZE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "=== Submitting PKG for notarization ==="
            SUBMISSION_OUTPUT=$(xcrun notarytool submit build/installer/Sunshine-$SUNSHINE_VERSION.pkg \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_NOTARIZE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait 2>&1)
            echo "$SUBMISSION_OUTPUT"

            # Check for notarization failure
            SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
            if echo "$SUBMISSION_OUTPUT" | grep -q "status: Invalid"; then
              echo "=== Notarization failed! Fetching log ==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_NOTARIZE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                notarization-log.json || true
              cat notarization-log.json || true
              exit 1
            fi

            echo "=== Stapling notarization ticket ==="
            xcrun stapler staple build/installer/Sunshine-$SUNSHINE_VERSION.pkg
            xcrun stapler validate build/installer/Sunshine-$SUNSHINE_VERSION.pkg
            echo "=== PKG notarized and stapled successfully ==="
          else
            echo "=== Notarization skipped (set APPLE_ID, APPLE_NOTARIZE_PASSWORD, APPLE_TEAM_ID) ==="
          fi
        else
          echo "WARNING: No APPLE_DEVELOPER_ID_INSTALLER - PKG will not be signed"
          mv build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg build/installer/Sunshine-$SUNSHINE_VERSION.pkg || true
        fi

        echo "=== Code signing complete ==="
      else
        echo "=== No signing certificate - using unsigned package ==="
        mv build/installer/Sunshine-$SUNSHINE_VERSION-unsigned.pkg build/installer/Sunshine-$SUNSHINE_VERSION.pkg || true
      fi
    # Generate SHA256 checksum
    - shasum -a 256 build/installer/Sunshine-$SUNSHINE_VERSION.pkg > build/installer/Sunshine-$SUNSHINE_VERSION.pkg.sha256 || true
    - cat build/installer/Sunshine-$SUNSHINE_VERSION.pkg.sha256 || true
  artifacts:
    paths:
      - build/installer/Sunshine-*.pkg
      - build/installer/Sunshine-*.pkg.sha256
      - notarization-log.json
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

# =============================================================================
# Deploy Stage
# =============================================================================

# Create GitLab Release
# Publishes releases on both main branch commits and git tags
# Uses release-cli directly since we need dynamic tag names
release:
  stage: deploy
  tags:
    - tinyland
    - linux
    - docker
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: sign-darwin
      artifacts: true
      optional: true
    - job: package-rocky
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache grep
  script:
    - export SUNSHINE_VERSION=$(grep -m1 'project.*VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.24.0")
    # Generate release tag and name
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export RELEASE_TAG="$CI_COMMIT_TAG"
        export RELEASE_NAME="Tinyland Sunshine $CI_COMMIT_TAG"
      else
        export RELEASE_TAG="v${SUNSHINE_VERSION}-${CI_COMMIT_SHORT_SHA}"
        export RELEASE_NAME="Tinyland Sunshine ${SUNSHINE_VERSION} (${CI_COMMIT_SHORT_SHA})"
      fi
    - echo "Creating release $RELEASE_NAME with tag $RELEASE_TAG"
    # Create tag if it doesn't exist
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "Creating tag $RELEASE_TAG"
        git config user.email "ci@tinyland.dev"
        git config user.name "Tinyland CI"
        git tag -a "$RELEASE_TAG" -m "Automated release $RELEASE_NAME"
        git push origin "$RELEASE_TAG" || echo "Tag push failed (may already exist)"
      fi
    # Create release using release-cli
    - |
      release-cli create \
        --name "$RELEASE_NAME" \
        --tag-name "$RELEASE_TAG" \
        --description "Tinyland Sunshine ${SUNSHINE_VERSION}

      Built from commit ${CI_COMMIT_SHORT_SHA}

      ## Artifacts
      - Darwin PKG: macOS 12+ (Apple Silicon)
      - Rocky RPM: Rocky Linux 9/10

      ## Installation

      ### macOS
      \`\`\`bash
      sudo installer -pkg Sunshine-${SUNSHINE_VERSION}.pkg -target /
      \`\`\`

      ### Rocky Linux
      \`\`\`bash
      sudo dnf install -y ./sunshine-${SUNSHINE_VERSION}-*.rpm
      sudo setcap cap_sys_admin+p /usr/bin/sunshine
      \`\`\`" \
        --assets-link "{\"name\":\"Sunshine-${SUNSHINE_VERSION}.pkg\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/build/installer/Sunshine-${SUNSHINE_VERSION}.pkg?job=sign-darwin\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"sunshine-${SUNSHINE_VERSION}.rpm\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/build/rpm/sunshine-${SUNSHINE_VERSION}-1.tinyland.el10.x86_64.rpm?job=package-rocky\",\"link_type\":\"package\"}"
  rules:
    # Publish releases on master/main branch commits
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    # Also publish on git tags
    - if: $CI_COMMIT_TAG
      when: on_success
  allow_failure: true

# =============================================================================
# Trigger crush-dots GitOps Deployment
# =============================================================================
# Triggers the crush-dots (tinyland/lab) pipeline to deploy new Sunshine builds
# This enables GitOps: sunshine build → crush-dots Molecule tests → staged deployment

trigger:crush-dots:
  stage: deploy
  trigger:
    project: tinyland/lab
    branch: main
    strategy: depend  # Wait for downstream pipeline result
  variables:
    TRIGGER_SOURCE: sunshine
    SUNSHINE_VERSION: $SUNSHINE_VERSION
    SUNSHINE_COMMIT: $CI_COMMIT_SHORT_SHA
  needs:
    - job: release
      optional: true
    - job: sign-darwin
      optional: true
    - job: package-rocky
      optional: true
  rules:
    # Trigger on successful release (master/main)
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    # Also trigger on tags
    - if: $CI_COMMIT_TAG
      when: on_success
  allow_failure: true  # Don't fail sunshine pipeline if crush-dots fails
